# CoPiano 营销站 — Nginx site config
# 部署路径: /etc/nginx/sites-available/copiano.com
# 启用: sudo ln -s ../sites-available/copiano.com /etc/nginx/sites-enabled/
# 测试: sudo nginx -t && sudo systemctl reload nginx

# --- HTTP → HTTPS 重定向 + ACME challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name copiano.com www.copiano.com;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 主站 HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name copiano.com www.copiano.com;

    # SSL 证书 (Let's Encrypt,部署 certbot 后会自动生成)
    ssl_certificate /etc/letsencrypt/live/copiano.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copiano.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/copiano.com/chain.pem;

    # SSL 配置 (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # 访问/错误日志
    access_log /var/log/nginx/copiano.com.access.log;
    error_log /var/log/nginx/copiano.com.error.log;

    # 客户端请求体上限 (MIDI 上传由后端处理,前端无需过大)
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 反代到 Next.js standalone (默认端口 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next.js SSR 超时 (默认 60s,LLM 流式可能更长)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 健康检查端点 — 不缓存
    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    # 静态资源缓存 (Next.js 静态化)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # sitemap / robots 直接走 Next.js
    location ~* ^/(sitemap\.xml|robots\.txt|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }
}
