# CoPiano 全站 Nginx 路由配置 — yefzyj.top
# 部署路径: /etc/nginx/sites-available/yefzyj.top
# 启用: sudo ln -sf ../sites-available/yefzyj.top /etc/nginx/sites-enabled/yefzyj.top

# ─────────────────────────────────────────────
# HTTP → HTTPS 重定向 (6 域名) + ACME challenge
# ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yefzyj.top www.yefzyj.top app.yefzyj.top api.yefzyj.top docs.yefzyj.top admin.yefzyj.top;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────
# 共享 SSL 配置片段
# ─────────────────────────────────────────────
# 抽出重复 SSL 设置 (所有 server 块共用)
# 通过 include 复用

# ─────────────────────────────────────────────
# 主站 / 营销页 (yefzyj.top + www.yefzyj.top)
# 反代到 Next.js standalone (默认 :3000,部署后跑)
# ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yefzyj.top www.yefzyj.top;

    ssl_certificate /etc/letsencrypt/live/yefzyj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yefzyj.top/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yefzyj.top/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;
    ssl_stapling_verify off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/yefzyj.top.access.log;
    error_log /var/log/nginx/yefzyj.top.error.log;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(sitemap\.xml|robots\.txt|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        expires 1h;
    }
}

