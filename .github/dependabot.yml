# Dependabot — CoPiano repo
# 配置: https://github.com/YuEFeng-and-ZhouYingJie-s-Digital-Home/Co-Piano/settings/security_analysis
# 自动创建依赖更新 PR (Python pip + npm + Docker)

version: 2
updates:
  # Backend — Python pip
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area/backend"
    commit-message:
      prefix: "deps(backend)"
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Web — npm
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area/web"
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "thursday"
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "docker(backend)"
