name: Deploy

# 触发:
#   1. main 分支 push (在 CI 跑过后自动部署)
#   2. 手动 workflow_dispatch (选择环境)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'web/deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 部署 Web 端 (Next.js) ============
  deploy-web:
    name: Deploy Web (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MARKETING_URL: ${{ secrets.NEXT_PUBLIC_MARKETING_URL }}
          NEXT_PUBLIC_WS_BASE_URL: ${{ secrets.NEXT_PUBLIC_WS_BASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            --exclude='.git' \
            --exclude='.env.local' \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            web/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/copiano/web/

      - name: Remote deploy
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'REMOTE'
            cd /opt/copiano/web
            docker compose -f deploy/docker-compose.yml build --no-cache
            docker compose -f deploy/docker-compose.yml up -d
            docker compose -f deploy/docker-compose.yml ps
          REMOTE

      - name: Health check
        run: |
          sleep 10
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://yefzyj.top/api/health || echo "000")
          if [ "$HEALTH" = "200" ]; then
            echo "✅ Web deployed: https://yefzyj.top → 200"
          else
            echo "❌ Web health check failed: $HEALTH"
            ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'docker logs --tail 50 copiano-web'
            exit 1
          fi

  # ============ 部署后端 (FastAPI) ============
  deploy-backend:
    name: Deploy Backend (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync backend
        run: |
          rsync -avz --delete \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.env' \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            backend/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/copiano/backend/

      - name: Remote deploy
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'REMOTE'
            cd /opt/copiano/backend
            source venv/bin/activate 2>/dev/null || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart copiano-backend 2>/dev/null || echo "systemd 未配,跳过"
          REMOTE

      - name: Health check
        run: |
          sleep 5
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' https://api.yefzyj.top/api/v1/users/me -H "Authorization: Bearer fake" || echo "000")
          if [ "$HEALTH" = "401" ] || [ "$HEALTH" = "403" ]; then
            echo "✅ Backend deployed: https://api.yefzyj.top → $HEALTH (running)"
          elif [ "$HEALTH" = "200" ]; then
            echo "✅ Backend deployed: https://api.yefzyj.top → 200"
          else
            echo "❌ Backend health check failed: $HEALTH"
            exit 1
          fi
